site_name: 机器学习工程（ML Engineering）· 简体中文版
site_description: 《Machine Learning Engineering》(Stas Bekman) 简体中文翻译，面向计算机专业本科低年级读者
site_url: https://codingpracticegroup.github.io/ml-engineering/
repo_url: https://github.com/CodingPracticeGroup/ml-engineering
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: 切换深色模式}
    - scheme: slate
      primary: black
      toggle: {icon: material/weather-sunny, name: 切换浅色模式}
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy

plugins:
  - search:
      lang: zh

extra_css:
  - extra.css

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

